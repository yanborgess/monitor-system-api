# Nome da aplicação
spring.application.name=monitor-system

pring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/monitor_system}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:sua_senha_padrao}

# Driver e Dialeto
spring.datasource.driverClassName=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Isso aqui faz o Spring criar as tabelas sozinho baseado nas suas classes @Entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

api.security.token.secret=${JWT_SECRET:chave_padrao_para_desenvolvimento}