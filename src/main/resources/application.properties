# Nome da aplicação
spring.application.name=monitor-system

spring.datasource.url=jdbc:postgresql://localhost:5432/db_monitoramento
spring.datasource.username=postgres
spring.datasource.password=1973

# Driver e Dialeto
spring.datasource.driverClassName=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Isso aqui faz o Spring criar as tabelas sozinho baseado nas suas classes @Entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true